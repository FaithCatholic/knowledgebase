applications:
  drupal:

    source:
      root: "/"

    type: "php:8.2"

    relationships:
      dbmysql:

    mounts:

      '/web/sites/default/files':
         source: storage
         source_path: 'files'

      '/tmp':
         source: storage
         source_path: 'tmp'

      '/private':
         source: storage
         source_path: 'private'

      '/.drush':
         source: storage
         source_path: 'drush'

      '/drush-backups':
         source: storage
         source_path: 'drush-backups'

      '/.console':
         source: storage
         source_path: 'console'

    web:

      locations:
        "/":
          passthru: "/index.php"
          root: "web"
          
    build:
      flavor: composer

    dependencies:
      nodejs:
        n: "*"
      php:
        composer/composer: "^2"


    hooks:
      build: |
        set -eux
        composer --no-ansi --no-interaction install --no-progress --prefer-dist --optimize-autoloader --no-dev
        
        set -e

        # Install the version specified in the .nvmrc file
        n auto

        # Reset the location hash to recognize the newly installed version
        hash -r          

        # Build custom theme
        composer genesis-setup
        #composer slides-setup

        
      deploy: |
        set -eux
        # echo 'Put your deploy command here'
  


services:
  dbmysql:
    type: oracle-mysql:8.0 

  
routes:
  "https://{default}/":
    type: upstream
    upstream: "drupal:http"

  "https://www.{default}":
    type: redirect
    to: "https://{default}/"
