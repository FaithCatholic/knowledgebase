label: Global
code: |-
  (function () {
    const fixBackToSite = () => {
      // Find all breadcrumb spans
      const spans = document.querySelectorAll('.gin-breadcrumb__text');
      
      spans.forEach(span => {
        // Check if text includes "Back to site" (case-insensitive & handles whitespace)
        if (span.textContent.trim().toLowerCase() === 'back to site' && !span.parentElement.classList.contains('wrapped-link')) {
          const link = document.createElement('a');
          link.href = '/';
          link.className = 'gin-breadcrumb__link wrapped-link';
          link.style.color = 'inherit';
          link.style.text-decoration = 'none';
          
          // Move the span inside the link
          span.parentNode.insertBefore(link, span);
          link.appendChild(span);
        }
      });
    };

    // Run on load
    fixBackToSite();

    // Run whenever the document changes (to catch AJAX/Gin dynamic loads)
    const observer = new MutationObserver(fixBackToSite);
    observer.observe(document.body, { childList: true, subtree: true });
  })();
