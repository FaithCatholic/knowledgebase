id: logo_link_fix
label: 'Logo link fix'
code: |-
  (function ($, Drupal) {
    Drupal.behaviors.ginLogoFixSurgical = {
      attach: function (context) {
        // Find the logo link specifically where href is empty or just #
        const $logo = $('.toolbar-logo.is-active', context);
        
        if ($logo.length) {
          // 1. Force the href to the homepage
          $logo.attr('href', '/');
          
          // 2. Remove the 'is-active' state so it doesn't look disabled
          $logo.removeClass('is-active');
          
          // 3. Optional: Remove the aria-current so screen readers treat it as a link
          $logo.removeAttr('aria-current');
        }
      }
    };
  })(jQuery, Drupal);
noscript: ''
