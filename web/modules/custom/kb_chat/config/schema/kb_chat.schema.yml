kb_chat.web_source.*:
  type: config_entity
  label: 'KB chat trusted website'
  mapping:
    id:
      type: machine_name
      label: 'ID'
    label:
      type: label
      label: 'Name'
    start_urls:
      type: sequence
      label: 'Start URLs'
      sequence:
        type: uri
    include_prefixes:
      type: sequence
      label: 'URL prefixes the crawl may follow'
      sequence:
        type: uri
    documents:
      type: boolean
      label: 'Include linked PDF, Word and Excel files'
    frequency:
      type: string
      label: 'How often it changes: daily, weekly or monthly'
    tier:
      type: string
      label: 'Who can see it: staff or management'
    max_pages:
      type: integer
      label: 'Most pages to index'
    owner:
      type: string
      label: 'Who runs it: faith or third_party'
    guidance:
      type: text
      label: 'What it is the authority for (shown to the chat)'

kb_chat.drive:
  type: config_object
  label: 'KB chat Google Drive sync'
  mapping:
    exclude_drives:
      type: sequence
      label: 'Shared drives to leave out (names or IDs)'
      sequence:
        type: string
    exclude_folders:
      type: sequence
      label: 'Folders to leave out, with everything inside (paths or IDs)'
      sequence:
        type: string
    exclude_names:
      type: sequence
      label: 'Skip files whose names contain these'
      sequence:
        type: string
    list_interval:
      type: integer
      label: 'Seconds between full listings of the drives'
    max_file_bytes:
      type: integer
      label: 'Largest file to read, in bytes'
    max_pdf_bytes:
      type: integer
      label: 'Largest PDF to read, in bytes'
