kb_chat.google_billing:
  path: '/kb-chat/billing/google'
  defaults:
    _controller: '\Drupal\kb_chat\Controller\GoogleBillingController::receive'
  methods: [POST]
  requirements:
    # Google Pub/Sub pushes here; the controller checks the shared token.
    _access: 'TRUE'
  options:
    no_cache: TRUE

kb_chat.web_source_crawl:
  path: '/admin/config/search/kb-chat-websites/{kb_chat_web_source}/crawl'
  defaults:
    _controller: '\Drupal\kb_chat\Controller\WebSourceController::crawl'
  requirements:
    _permission: 'administer kb chat websites'
    _csrf_token: 'TRUE'

kb_chat.drive_settings:
  path: '/admin/config/search/kb-chat-drive'
  defaults:
    _form: '\Drupal\kb_chat\Form\DriveSettingsForm'
    _title: 'KB chat Google Drive'
  requirements:
    _permission: 'administer kb chat websites'

kb_chat.drive_files:
  path: '/admin/config/search/kb-chat-drive/files'
  defaults:
    _form: '\Drupal\kb_chat\Form\DriveFilesForm'
    _title: 'Indexed Google Drive files'
  requirements:
    _permission: 'administer kb chat websites'

kb_chat.my_searches:
  path: '/my-searches'
  defaults:
    _controller: '\Drupal\kb_chat\Controller\MySearchesController::list'
    _title: 'My searches'
  requirements:
    _permission: 'access deepchat api'
    _user_is_logged_in: 'TRUE'

kb_chat.my_search:
  path: '/my-searches/{thread}'
  defaults:
    _controller: '\Drupal\kb_chat\Controller\MySearchesController::view'
    _title_callback: '\Drupal\kb_chat\Controller\MySearchesController::title'
  requirements:
    _permission: 'access deepchat api'
    _user_is_logged_in: 'TRUE'
    thread: '[^/]+'

kb_chat.my_search_delete:
  path: '/my-searches/{thread}/delete'
  defaults:
    _controller: '\Drupal\kb_chat\Controller\MySearchesController::delete'
  requirements:
    _permission: 'access deepchat api'
    _user_is_logged_in: 'TRUE'
    _csrf_token: 'TRUE'
    thread: '[^/]+'
