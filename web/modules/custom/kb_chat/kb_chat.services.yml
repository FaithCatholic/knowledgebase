services:
  _defaults:
    autowire: true
  logger.channel.kb_chat:
    parent: logger.channel_base
    arguments: ['kb_chat']
  Drupal\kb_chat\CostTracker: ~
  Drupal\kb_chat\AnthropicCostReport: ~
  Drupal\kb_chat\EventSubscriber\UsageSubscriber:
    tags:
      - { name: event_subscriber }
  Drupal\kb_chat\Drive\TextExtractor: ~
  Drupal\kb_chat\Drive\DriveSync: ~
  Drupal\kb_chat\EventSubscriber\AnthropicSettingsSubscriber:
    tags:
      - { name: event_subscriber }
  Drupal\kb_chat\Web\WebSync: ~
  Drupal\kb_chat\JobLog: ~
  Drupal\kb_chat\ConversationLog: ~
